# dataset_strategy.yaml

co3d:
  default_config:
    sparsegs_triangulate:
      split_method: paper_even  # paper_even cluster_stride pose_fps
      runs:
        - n_views: 12
    train_only_mapper:
      split_method: cluster_stride
      runs:
        - n_views: 9
          stride: 3
          start_pos: 0
  split_hold: 1000
  not_include: []
  test: [car2]
  scene:
    car1:
      sparsegs_triangulate:
        split_method: pose_fps
        runs:
          - n_views: 12
      train_only_mapper:
        split_method: cluster_stride
        runs:
          - n_views: 9
            stride: 3
            start_pos: 0
    car2:
      sparsegs_triangulate:
        split_method: paper_even
        runs:
          - n_views: 12
      train_only_mapper:
        split_method: cluster_stride
        runs:
          - n_views: 9
            stride: 4
            start_pos: 0
    car3:
      sparsegs_triangulate:
        split_method: paper_even
        runs:
          - n_views: 18
      train_only_mapper:
        split_method: cluster_stride
        runs:
          - n_views: 12
            stride: 3
            start_pos: 0
    car4:
      sparsegs_triangulate:
        split_method: paper_even
        runs:
          - n_views: 15
      train_only_mapper:
        split_method: cluster_stride
        runs:
          - n_views: 12
            stride: 2
            start_pos: 0
    car5:
      sparsegs_triangulate:
        split_method: paper_even
        runs:
          - n_views: 12
      train_only_mapper:
        split_method: cluster_stride
        runs:
          - n_views: 6
            stride: 4
            start_pos: 0


